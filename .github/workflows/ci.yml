name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: arp_test
          POSTGRES_USER: arp_test
          POSTGRES_PASSWORD: arp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arp_test -d arp_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ARP_TEST_POSTGRES_URL: postgresql+psycopg://arp_test:arp_test@localhost:5432/arp_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --dev --frozen
      - run: uv run pytest
      - run: uv build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
